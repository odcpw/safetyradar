# nginx alternative; HTTPS via: certbot --nginx -d safetyradar.ch -d www.safetyradar.ch (auto-renew timer)
server {
    listen 80; listen [::]:80;
    server_name safetyradar.ch www.safetyradar.ch;
    root /var/www/safetyradar;
    add_header X-Robots-Tag "noindex, nofollow" always;  # remove at go-live
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
}
