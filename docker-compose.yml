# Daily job: docker compose run --rm pipeline   (from a host timer/cron; the image holds only the toolchain).
# Caddy serves ./dist; alternatively run Caddy on the host (deploy/caddy/Caddyfile).
services:
  pipeline:
    build: .
    env_file: .env
    environment: { SAFETYRADAR_ENV_LOADED: "1", PUBLISH_DIR: "" }
    volumes:
      - .:/app                                   # checkout incl. .git, data/, reviewer/state (gitignored state)
      - ./deploy/ssh:/home/node/.ssh:ro          # optional: deploy key + known_hosts for git push over SSH
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro", "./dist:/srv/safetyradar:ro", "caddy_data:/data"]
volumes: { caddy_data: {} }
